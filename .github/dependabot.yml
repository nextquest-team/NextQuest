# Dependabot : updates automatiques des dependances.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Dependances npm/pnpm pour tout le monorepo (root + apps + packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Regrouper les patches/minor en une seule PR par semaine pour eviter le bruit
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Les majors restent en PRs separees pour review individuelle
      types:
        patterns:
          - "@types/*"

  # Versions des actions GitHub elles-memes (actions/checkout, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    commit-message:
      prefix: "chore(ci)"
