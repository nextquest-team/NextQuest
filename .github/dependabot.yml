# Dependabot : updates automatiques des dependances.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Dependances npm/pnpm pour tout le monorepo (root + apps + packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Les majors cassent souvent les peer deps Nuxt/Expo. On les ignore par
    # defaut et on les bumpera a la main au cas par cas quand l'ecosysteme suit.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Regrouper les patches/minor en une seule PR par semaine pour eviter le bruit
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Les @types/* (qui sont en theorie alignes avec le runtime) en groupe
      types:
        patterns:
          - "@types/*"

  # Versions des actions GitHub elles-memes (actions/checkout, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    commit-message:
      prefix: "chore(ci)"
    # Idem npm : majors a la main, Dependabot ne nous deborde pas
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
