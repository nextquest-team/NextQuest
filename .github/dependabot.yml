# Mises a jour des dependances : une PR groupee par semaine pour les mineures et correctifs
# (fusionnee seule si la CI est verte, voir workflows/dependabot-auto-merge.yml).
# Les majeures sont ignorees : elles cassent souvent les peer deps Nuxt/Expo et se bumpent
# a la main, au cas par cas. Le cooldown laisse quelques jours a la communaute pour reperer
# une version piegee avant qu'elle n'arrive ici.
version: 2
updates:
  # Un seul pnpm-lock.yaml a la racine : "/" couvre tout le monorepo (apps/* et packages/*).
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 5
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Dependances sensibles (voir SENSIBLES du workflow) : leurs mineures sont relues a la main.
      # Groupe place AVANT le principal (premiere correspondance) pour ne pas bloquer le reste.
      sensibles:
        patterns:
          - "nuxt"
          - "vue"
          - "vuetify"
          - "fastify"
          - "expo"
          - "react-native"
          - "drizzle-orm"
          - "drizzle-kit"
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # vite est fige volontairement en 8.3.8 (overrides de pnpm-workspace.yaml) : on ne monte
      # pas de version sans repasser le test HMR (nuxt dev + vrai navigateur).
      - dependency-name: vite
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
