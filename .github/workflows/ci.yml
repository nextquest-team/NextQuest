name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Principe de moindre privilege : le GITHUB_TOKEN n'a besoin que de lire le repo
# pour checkout. Pas d'ecriture, pas d'autres scopes.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextquest_test
          POSTGRES_USER: nextquest
          POSTGRES_PASSWORD: nextquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://nextquest:nextquest@localhost:5432/nextquest_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
