name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Principe de moindre privilege : le GITHUB_TOKEN n'a besoin que de lire le repo
# pour checkout. Pas d'ecriture, pas d'autres scopes.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextquest_test
          POSTGRES_USER: nextquest
          POSTGRES_PASSWORD: nextquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nextquest:nextquest@localhost:5432/nextquest_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      # Actions epinglees par SHA exact (pas par tag mutable) :
      # protege contre une supply-chain attack qui re-pousserait
      # un tag malveillant. Dependabot bumpe les SHAs automatiquement.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Migrations avant les tests : sinon vitest tape sur des tables inexistantes
      - name: Run database migrations
        run: pnpm --filter @nextquest/db db:migrate

      - name: Test
        run: pnpm test

      # Build prod : verifie que le code transpile correctement, attrape les
      # erreurs de bundling specifiques au build (imports manquants, etc.)
      - name: Build
        run: pnpm build
