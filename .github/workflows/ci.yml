name: CI

on:
  pull_request:
    branches: [main, develop]
  # Pas de re-run sur push develop : la PR teste deja le merge ref, et le merge
  # commit est identique (squash/merge sans autre PR entrelacee). On garde main
  # comme filet de securite avant prod.
  push:
    branches: [main]

# Principe de moindre privilege : le GITHUB_TOKEN n'a besoin que de lire le repo
# pour checkout. Pas d'ecriture, pas d'autres scopes.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextquest_test
          POSTGRES_USER: nextquest
          POSTGRES_PASSWORD: nextquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nextquest:nextquest@localhost:5432/nextquest_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      # Actions epinglees par SHA exact (pas par tag mutable) :
      # protege contre une supply-chain attack qui re-pousserait
      # un tag malveillant. Dependabot bumpe les SHAs automatiquement.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Génère packages/shared/src/types/api.ts (gitignore) avant le typecheck.
      # Le script instancie Fastify sans démarrer le serveur — pas de connexion DB/Redis.
      - name: Codegen
        run: pnpm codegen

      - name: Typecheck
        run: pnpm typecheck

      # Migrations avant les tests : sinon vitest tape sur des tables inexistantes
      - name: Run database migrations
        run: pnpm --filter @nextquest/db db:migrate

      - name: Test
        run: pnpm test

      # Build prod : verifie que le code transpile correctement, attrape les
      # erreurs de bundling specifiques au build (imports manquants, etc.)
      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @nextquest/web exec playwright install --with-deps chromium

      # Tests e2e d'accessibilite (axe-core) contre le build de prod, pas
      # `nuxt dev` : evite tout risque lie au HMR (voir docs/journal-lo.md).
      # L'auth des pages protegees est mockee au niveau reseau (voir
      # tests-e2e/fixtures/auth.ts) : pas besoin de l'API ni de la DB ici.
      - name: Start prod server
        working-directory: apps/web
        run: |
          PORT=3001 node .output/server/index.mjs &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || true)
            [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "Le serveur n'a pas démarré à temps" >&2
          exit 1

      - name: Test e2e (accessibilité)
        run: pnpm --filter @nextquest/web test:e2e
