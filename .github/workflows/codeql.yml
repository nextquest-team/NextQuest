# CodeQL : analyse de securite statique fournie par GitHub.
# Detecte les patterns dangereux (XSS, prototype pollution, etc.) selon
# OWASP Top 10. Les resultats apparaissent dans l'onglet "Security" du repo.
#
# On utilise un workflow custom (et pas le default setup GitHub) pour
# pouvoir charger .github/codeql/codeql-config.yml qui exclut une regle
# qui produit des faux positifs sur notre stack (cf. config pour le detail).
name: CodeQL

on:
  # Pas de re-run sur push develop : la PR analyse deja le merge ref. On garde
  # main pour avoir une trace CodeQL signee sur le code de prod.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # Analyse complete une fois par semaine, meme sans changement,
  # pour rattraper les nouveaux patterns ajoutes par GitHub a la base de regles
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "actions"]

    steps:
      # Actions epinglees par SHA exact (cf. ci.yml pour la motivation)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          category: "/language:${{ matrix.language }}"
