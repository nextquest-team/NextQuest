services:
  postgres:
    image: postgres:16-alpine
    container_name: nextquest-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nextquest
      POSTGRES_USER: nextquest
      POSTGRES_PASSWORD: nextquest
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextquest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nextquest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application web Nuxt 3 (mode développement avec hot reload)
  web:
    image: node:22-alpine
    container_name: nextquest-web
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter @nextquest/web dev"
    ports:
      - "3001:3001"
    volumes:
      # Monte le code source pour le hot reload
      - ..:/app
      # Préserve les node_modules du container
      - web_modules:/app/node_modules
      - web_nuxt:/app/apps/web/.nuxt
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      # TODO: mettre à jour avec l'URL de l'API dans le réseau Docker quand l'API sera dockerisée
      - NUXT_PUBLIC_API_BASE=http://localhost:3000
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  web_modules:
  web_nuxt:
