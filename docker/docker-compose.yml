services:
  postgres:
    image: postgres:16-alpine
    container_name: nextquest-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nextquest
      POSTGRES_USER: nextquest
      POSTGRES_PASSWORD: nextquest
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextquest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nextquest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stockage objet S3-compatible (avatars). Console web d'admin sur :9001.
  # Tag epingle : les builds communautaires recents ont ampute la console web,
  # on fige une version pour que toute l'equipe ait la meme.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nextquest-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nextquest
      MINIO_ROOT_PASSWORD: nextquest1
    volumes:
      - minio_data:/data
    # Pas de depends_on cote api : l'API est fail-soft (elle demarre sans MinIO,
    # les routes avatar repondent 503 en attendant). Le healthcheck sert a la
    # visibilite (docker compose ps) et aux outils, pas au sequencement du boot.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Fastify (mode développement avec hot reload via tsx watch)
  api:
    image: node:22-alpine
    container_name: nextquest-api
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter @nextquest/api dev"
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - api_modules:/app/node_modules
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      # Surcharge les valeurs localhost du .env pour le réseau Docker interne
      - DATABASE_URL=postgresql://nextquest:nextquest@postgres:5432/nextquest
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://api:3000
      # URL publique de l'API utilisée pour le redirect_uri OAuth (doit être
      # joignable par le browser, contrairement à API_BASE_URL qui est le DNS Docker interne)
      - OAUTH_CALLBACK_BASE_URL=http://localhost:3000
      - OAUTH_REDIRECT_URL=http://localhost:3001
      # Stockage objet interne au reseau Docker ; l'URL publique doit rester
      # joignable par le browser (localhost cote poste dev)
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=nextquest
      - S3_SECRET_KEY=nextquest1
      - S3_BUCKET=nextquest-avatars
      - S3_PUBLIC_URL=http://localhost:9000/nextquest-avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Application web Nuxt 3 (mode développement avec hot reload)
  web:
    image: node:22-alpine
    container_name: nextquest-web
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter @nextquest/web dev"
    ports:
      - "3001:3001"
    volumes:
      - ..:/app
      - web_modules:/app/node_modules
      - web_nuxt:/app/apps/web/.nuxt
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - NUXT_API_BASE=http://api:3000
      - NUXT_PUBLIC_API_BASE=http://localhost:3000
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
  api_modules:
  web_modules:
  web_nuxt:
