packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - argon2
  - esbuild
  - "@parcel/watcher"

# Forcer les versions patch sur les transitives flaggees par Dependabot. A
# revoir periodiquement quand les parents (expo, nuxt, drizzle-kit) sont
# updates. vite est fige en exact 8.1.6 (pas en floor >=) : la regression
# handleUpgrade venait d'un conflit Nuxt 3 / Vite 8.1, contournee dans
# apps/web/nuxt.config.ts. On garde l'exact pour ne pas monter de mineure
# sans repasser le test HMR (nuxt dev + vrai navigateur).
overrides:
  fast-jwt: ">=6.3.4 <7"
  fast-uri: ">=4.2.3 <5"
  "@xmldom/xmldom": ">=0.9.12 <0.10"
  defu: ">=6.1.5"
  fastify: ">=5.12.1 <6"
  lodash: ">=4.18.0"
  tar: ">=7.5.21 <8"
  undici: ">=6.29.1 <7"
  # Borne <5 : tous les parents declarent js-yaml 4.x, un floor sans plafond
  # forcerait la majeure 5 que personne ne supporte (meme piege que vite 8).
  js-yaml: ">=4.3.2 <5"
  shell-quote: ">=1.11.0 <2"
  vite: "8.1.6"
  "@fastify/static": ">=10.1.2 <11"
  esbuild: ">=0.25.0"
  postcss: ">=8.5.23 <9"
  unhead: ">=2.1.13 <3"
  "@unhead/vue": ">=2.1.13 <3"
  uuid: ">=14.0.0"
  ws: ">=8.20.1"
  brace-expansion: ">=5.0.12 <6"
  # 3.3.18 et non 3.3.16 : un second avis (GHSA-2v37-7h3g-55p8) couvre
  # tout ce qui est sous 3.3.18, que Dependabot ne remonte pas encore.
  nanoid: ">=3.3.18 <4"
  # DoS qs.stringify, tire par supertest (tests uniquement).
  qs: ">=6.16.0 <7"
  find-my-way: ">=9.7.0 <10"
  # nuxt 3.21.11 declare deja devtools ^3.3.1, l'override empeche juste
  # un parent tiers de re-descendre sous le patch RPC.
  "@nuxt/devtools": ">=3.3.1 <4"
  devalue: ">=5.9.3 <6"
  launch-editor: ">=2.14.2 <3"
  browserslist: ">=4.28.7 <5"
  baseline-browser-mapping: ">=2.11.0 <3"
  # Seule la lignee 4.x est vulnerable : selecteur de plage pour ne pas toucher une 3.x.
  "svgo@>=4.0.0 <5": ">=4.1.0 <5"
  # Idem, on reste dans la lignee 6.x (la 7 a une API differente).
  "postcss-selector-parser@>=6.0.0 <7": ">=6.1.3 <7"
  source-map-js: ">=1.2.2 <2"
  compression: ">=1.8.2 <2"
  sharp: ">=0.35.4 <0.36"
  # metro n'appelle image-size qu'avec un Buffer (default(content)), signature conservee en 2.x.
  image-size: ">=2.0.3 <3"
  # Lignee 7.x aussi touchee (la 6.x a son propre selecteur plus haut).
  "postcss-selector-parser@>=7.0.0 <8": ">=7.1.6 <8"
  "@fastify/busboy": ">=3.2.2 <4"
  seroval: ">=1.6.11 <2"
  fast-copy: ">=4.1.0 <5"
  serialize-javascript: ">=7.1.3 <8"
  happy-dom: ">=21.0.4 <22"
  zod: ">=4.6.6 <5"
  vue-i18n: ">=11.4.14 <12"
  "@intlify/core": ">=11.4.14 <12"
  "@intlify/core-base": ">=11.4.14 <12"
  "@intlify/shared": ">=11.4.14 <12"
  "@intlify/message-compiler": ">=11.4.14 <12"
  # Famille vue alignee : @vue/server-renderer <3.5.42 est vulnerable, et les
  # paquets @vue/* doivent rester sur la meme version que vue.
  vue: ">=3.5.42 <4"
  "@vue/shared": ">=3.5.42 <4"
  "@vue/reactivity": ">=3.5.42 <4"
  "@vue/runtime-core": ">=3.5.42 <4"
  "@vue/runtime-dom": ">=3.5.42 <4"
  "@vue/compiler-core": ">=3.5.42 <4"
  "@vue/compiler-dom": ">=3.5.42 <4"
  "@vue/compiler-sfc": ">=3.5.42 <4"
  "@vue/compiler-ssr": ">=3.5.42 <4"
  "@vue/server-renderer": ">=3.5.42 <4"
  # Tire par @nuxt/devtools (outil de dev uniquement, jamais embarque en prod) qui
  # declare ^3.36.0 ; la 4.x est la seule lignee corrigee, usage devtools limite a git log/status.
  simple-git: ">=4.0.1 <5"
  # Tire par @expo/cli (mobile, outillage de dev) : 12 avis dont 6 high, tous
  # corriges en 1.4.1, meme majeure.
  node-forge: ">=1.4.1 <2"
