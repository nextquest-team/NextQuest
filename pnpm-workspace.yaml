packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - argon2
  - esbuild
  - "@parcel/watcher"

# Forcer les versions patch sur les transitives flaggees par Dependabot. A
# revoir periodiquement quand les parents (expo, nuxt, drizzle-kit) sont
# updates. vite est temporairement figé en exact (pas en floor >=) car la
# 8.1.5 introduit une regression HMR ("handleUpgrade() was called more than
# once") qui fait planter `nuxt dev` a la premiere connexion websocket d'un
# vrai navigateur — voir docs/journal-lo.md.
overrides:
  fast-jwt: ">=6.2.4"
  fast-uri: ">=3.1.2"
  "@xmldom/xmldom": ">=0.8.13"
  defu: ">=6.1.5"
  fastify: ">=5.8.5"
  lodash: ">=4.18.0"
  tar: ">=7.5.16"
  undici: ">=6.27.0"
  js-yaml: ">=4.2.0"
  vite: "8.0.16"
  "@fastify/static": ">=9.1.1"
  esbuild: ">=0.25.0"
  postcss: ">=8.5.10"
  unhead: ">=2.1.13 <3"
  "@unhead/vue": ">=2.1.13 <3"
  uuid: ">=14.0.0"
  ws: ">=8.20.1"
  brace-expansion: ">=5.0.6"
